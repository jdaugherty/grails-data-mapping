import org.gradle.api.tasks.testing.logging.TestExceptionFormat

plugins {
    id 'groovy'
    id 'java-library'
}

version = projectVersion
group = 'org.grails'

ext {
    pomArtifactId = 'grails-datastore-gorm-mongodb'
    pomTitle = 'GORM for MongoDB'
    pomDescription = 'Provides a GORM Object Mapping implementations for the MongoDB Document Database'
    pomDevelopers = ['graemerocher': 'Graeme Rocher', 'jeffscottbrown': 'Jeff Brown', 'burtbeckwith': 'Burth Beckwith']
    mavenPublishUrl = 'https://repo.grails.org/grails/libs-snapshots-local'
}

dependencies {
    implementation platform("org.grails:grails-bom:$grailsVersion")
    api 'org.mongodb:mongodb-driver-sync'
    api project(':grails-datastore-gorm-validation')
    api project(':grails-datastore-gorm')
    api project(':gorm-mongodb-grails-datastore-gorm-bson')

    implementation 'org.grails:grails-core'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    compileOnly project(':grails-datastore-gorm-support'), {
        exclude group:'org.grails', module:'grails-datastore-gorm-hibernate-core'
    }
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    
    testImplementation project(':grails-datastore-gorm-tck')
    testImplementation project(':grails-gorm-testing-support')
    testImplementation 'org.hibernate.validator:hibernate-validator'
    testImplementation project(':grails-datastore-gorm-support'), {
        exclude group: 'org.grails', module:'grails-datastore-gorm-hibernate-core'
    }

    testImplementation "org.apache.groovy:groovy-json"
    testImplementation "org.apache.groovy:groovy-templates"
    testImplementation "org.apache.groovy:groovy-test-junit5"
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "org.junit.platform:junit-platform-runner"
    testImplementation "org.spockframework:spock-core", { transitive = false }
    testImplementation "org.testcontainers:mongodb:$testcontainersMongoDbVersion"
    testRuntimeOnly 'org.springframework:spring-aop'
}

apply from: rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
apply from: rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
apply from: rootProject.layout.projectDirectory.file('gradle/publish-config.gradle')
apply from: rootProject.layout.projectDirectory.file('gradle/tck-config.gradle')
